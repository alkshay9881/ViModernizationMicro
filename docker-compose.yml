version: "3.9"

networks:
  vimodernization-net:
    external: true

services:

  service-registry:
    build: ./service-registry
    image: service-registry:1.0
    container_name: service-registry
    ports:
      - "8761:8761"
    networks:
      - vimodernization-net
    environment:
      SPRING_PROFILES_ACTIVE: uat
    volumes:
      - "/home/akshay/Project Documents/DKYC_sammer/property_files:/app/config/propertyfiles"

  api-gateway:
    build: ./api-gateway
    image: api-gateway:1.0
    container_name: api-gateway
    ports:
      - "9090:9090"
    networks:
      - vimodernization-net
    depends_on:
      - service-registry
    environment:
      SPRING_PROFILES_ACTIVE: uat
    volumes:
      - "/home/akshay/Project Documents/DKYC_sammer/property_files:/app/config/propertyfiles"

  login-service:
    build: ./login-service
    image: login-service:1.0
    container_name: login-service
    ports:
      - "9091:9091"
    networks:
      - vimodernization-net
    depends_on:
      - service-registry
    environment:
      SPRING_PROFILES_ACTIVE: uat
    volumes:
      - "/home/akshay/Project Documents/DKYC_sammer/property_files:/app/config/propertyfiles"

