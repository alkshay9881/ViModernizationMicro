spring:
  application:
    name: login-service


  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

# ================= MANAGEMENT =================
  management:
    endpoints:
      web:
        exposure:
          include: health, metrics


# ================= LOGGING =================

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS, Asia/Kolkata} %level [%thread] %logger{36} - %msg%n"

mq:
  managers:
    SubmitCOCPDigitalCafLite:
      queueManager: QMGENERIC
      channel: QMGENGW.VCONECT.SCN
      connName: 10.94.135.147(8220)
      inputQueue: APPS.SUBCOCPCAFLITE.ESB.CPOS.RQI.02
      outputQueue: VCONN.CPOS.SUBCOCPCAFLITE.ESB.RPO.02
      timeout: 1500
      sslCipherSuite: TLS_RSA_WITH_AES_128_CBC_SHA256
      trustStore: /home/akshay/Desktop/docker/truststore.jks
      responseClass: com.mobicule.vodafone.loginService.syncMQ.model.response.ReadWriteRspGBOXML

