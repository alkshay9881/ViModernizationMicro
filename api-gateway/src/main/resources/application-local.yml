server:
  port: 9090

jwt:
  enabled: true

propertyFiles: config/local/propertyFilePaths.yml

spring:
  redis:
    host: localhost
    port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/vodafone

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

