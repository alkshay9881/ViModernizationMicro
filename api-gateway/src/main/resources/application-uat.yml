server:
  port: 9090

jwt:
  enabled: false

propertyFiles: config/uat/propertyFilePaths.yml

spring:
  redis:
    host: redis
    port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/vodafone

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka
  instance:
    prefer-ip-address: true