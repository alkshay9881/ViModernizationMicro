spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: genrateOTP-api
          uri: lb://LOGIN-SERVICE
          predicates:
            - Path=/api/v1/auth/generateOTP
          filters:
            - name: CircuitBreaker
              args:
                  name: loginServiceCB
                  fallbackUri: forward:/fallback/login

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 3
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@mobileKeyResolver}"

        - id: verifyOTP-api
          uri: lb://LOGIN-SERVICE
          predicates:
            - Path=/api/v1/auth/verifyOTP
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 3
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"

          # --------all other login SERVICE --------
        - id: login-service
          uri: lb://LOGIN-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: loginServiceCB
                fallbackUri: forward:/fallback/login

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
     console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


