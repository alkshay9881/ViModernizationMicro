spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

          # -------- login SERVICE --------
        - id: login-service
          uri: lb://LOGIN-SERVICE
          predicates:
            - Path=/api/v1/auth/**
#          filters:
#            - name: CircuitBreaker
#              args:
#                name: loginServiceCB
#                fallbackUri: forward:/fallback/login
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 1
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
     console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


